spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true

logging:
  level:
    com.example: DEBUG
    org.springframework.security: DEBUG

app:
  cookie:
    secure: false
    same-site: Lax
  cors:
    allowed-origins: http://localhost:5173  # port Vite, nie 3000
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  sendgrid:
    api-key: ${SENDGRID_API_KEY}
    from-email: noreply@taskmanager.com
  frontend-url: http://localhost:5173
