spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.example: INFO

app:
  cookie:
    secure: true
    same-site: Strict
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}